<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 380 360"><rect width="380" height="360" fill="#FFFFFF"/><text x="190.0" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">One channel = low-side MOSFET switch</text><line x1="90" y1="60" x2="290" y2="60" stroke="#E24B4A" stroke-width="3"/><text x="70" y="64" text-anchor="end" font-size="12" fill="#E24B4A" font-family="Helvetica, Arial, sans-serif" font-weight="bold">+3.7V</text><line x1="150" y1="60" x2="150" y2="95" stroke="#2C2C2A" stroke-width="2"/><circle cx="150" cy="120" r="24" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/><text x="150" y="125" text-anchor="middle" font-size="16" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif" font-weight="bold">M</text><line x1="150" y1="144" x2="150" y2="190" stroke="#2C2C2A" stroke-width="2"/><line x1="150" y1="80" x2="230" y2="80" stroke="#2C2C2A" stroke-width="2"/><line x1="230" y1="80" x2="230" y2="100" stroke="#2C2C2A" stroke-width="2"/><polygon points="215,140 245,140 230,110" fill="#2C2C2A"/><line x1="214" y1="108" x2="246" y2="108" stroke="#2C2C2A" stroke-width="3"/><line x1="230" y1="140" x2="230" y2="170" stroke="#2C2C2A" stroke-width="2"/><line x1="230" y1="170" x2="150" y2="170" stroke="#2C2C2A" stroke-width="2"/><text x="252" y="128" text-anchor="start" font-size="11" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">SS34 (stripe toward +)</text><text x="184" y="92" text-anchor="start" font-size="11" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">motor +</text><text x="156" y="186" text-anchor="start" font-size="11" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">drain (D)</text><line x1="150" y1="190" x2="150" y2="205" stroke="#2C2C2A" stroke-width="2"/><line x1="150" y1="205" x2="165" y2="205" stroke="#2C2C2A" stroke-width="2"/><line x1="165" y1="198" x2="165" y2="252" stroke="#2C2C2A" stroke-width="3"/><line x1="150" y1="245" x2="165" y2="245" stroke="#2C2C2A" stroke-width="2"/><line x1="150" y1="245" x2="150" y2="290" stroke="#2C2C2A" stroke-width="2"/><line x1="155" y1="198" x2="155" y2="252" stroke="#2C2C2A" stroke-width="2"/><line x1="110" y1="225" x2="155" y2="225" stroke="#2C2C2A" stroke-width="2"/><text x="172" y="230" text-anchor="start" font-size="12" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif" font-weight="bold">AO3400A</text><line x1="110" y1="225" x2="110" y2="250" stroke="#2C2C2A" stroke-width="2"/><rect x="102" y="250" width="16" height="30" fill="#1D9E75"/><line x1="110" y1="280" x2="110" y2="290" stroke="#2C2C2A" stroke-width="2"/><text x="96" y="270" text-anchor="end" font-size="11" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">10K</text><line x1="40" y1="225" x2="110" y2="225" stroke="#2C2C2A" stroke-width="2"/><circle cx="40" cy="225" r="5" fill="#7F77DD"/><text x="40" y="246" text-anchor="middle" font-size="11" fill="#7F77DD" font-family="Helvetica, Arial, sans-serif" font-weight="bold">ESP32 pin</text><text x="58" y="218" text-anchor="start" font-size="11" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">gate (G)</text><line x1="70" y1="290" x2="290" y2="290" stroke="#888780" stroke-width="3"/><text x="300" y="294" text-anchor="start" font-size="12" fill="#888780" font-family="Helvetica, Arial, sans-serif" font-weight="bold">GND</text><text x="156" y="284" text-anchor="start" font-size="11" fill="#5F5E5A" font-family="Helvetica, Arial, sans-serif">source (S)</text><text x="190" y="320" text-anchor="middle" font-size="11" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Pin HIGH: MOSFET conducts, current flows + -> motor -> D -> S -> GND.</text><text x="190" y="338" text-anchor="middle" font-size="11" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">Pin LOW: off. The diode lets the motor current circle back safely.</text><text x="190" y="354" text-anchor="middle" font-size="11" fill="#2C2C2A" font-family="Helvetica, Arial, sans-serif">10K keeps the gate at 0 V while the ESP32 is still booting.</text></svg>